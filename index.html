<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MIA 🖤</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,800;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════════════════════
     ССЫЛКИ — где менять, см. блок «НАСТРОЙКИ» внизу, в script.
     Файлы-картинки рядом с index.html:
       avatar.jpg — аватарка Mia в шапке чата
       photo.jpg  — фотка, которую она «присылает» в диалоге
     ════════════════════════════════════════════════════════ */
  :root {
    --paper: #17131f;
    --ink: #f0eaf8;
    --bubble: #262036;
    --accent: #cf6bd6;
    --accent-dark: #b04fb8;
    --ava-bg: #3a2f52;
    --ava-ink: #d9c9f5;
    --peach: #3d3350;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Nunito", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(207,107,214,.09), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(120,80,200,.14), transparent 45%),
      var(--paper);
    color: var(--ink);
    overflow: hidden;
  }
  .chat {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    max-width: 470px; margin: 0 auto;
    padding: 28px 22px;
  }
  .who {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 26px;
    animation: pop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .ava {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--ava-bg); color: var(--ava-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: "Caveat", cursive; font-size: 22px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .ava img {
    width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover; display: block;
  }
  .who .name { font-weight: 800; font-size: 16px; }
  .who .status { font-size: 12.5px; opacity: .55; }
  .who .status i { font-style: normal; color: #6dd28f; }

  .bubble {
    background: var(--bubble);
    border-radius: 20px; border-bottom-left-radius: 6px;
    padding: 13px 18px;
    max-width: 88%;
    box-shadow: 0 3px 14px rgba(0,0,0,.35);
    margin-bottom: 12px;
    font-size: 16.5px; line-height: 1.45;
    opacity: 0; transform: translateY(14px) scale(.96);
  }
  .bubble.show { animation: pop .45s cubic-bezier(.34,1.56,.64,1) both; }
  .bubble b { font-weight: 800; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  .typing {
    display: inline-flex; gap: 5px; align-items: center;
    background: var(--bubble);
    border-radius: 20px; border-bottom-left-radius: 6px;
    padding: 16px 18px; margin-bottom: 12px;
    box-shadow: 0 3px 14px rgba(0,0,0,.35);
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #8f7fb0;
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,70%,100% { opacity: .3; } 35% { opacity: 1; transform: translateY(-2px); } }

  .photo {
    padding: 8px;
    background: #1f1a2d; border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
    transform: rotate(-1.6deg);
    max-width: 246px;
    margin: 4px 0 16px;
    opacity: 0;
  }
  .photo.show { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .photo img {
    width: 100%; height: 180px; object-fit: cover; object-position: center 12%;
    border-radius: 10px; display: block;
  }
  .photo .cap {
    font-family: "Caveat", cursive; font-size: 19px; text-align: center;
    padding: 6px 2px 2px; opacity: .85;
  }

  .btn {
    align-self: flex-start;
    background: var(--accent); color: #fff;
    border: none; cursor: pointer; font-family: inherit;
    font-size: 17px; font-weight: 800;
    padding: 16px 34px; border-radius: 999px;
    box-shadow: 0 8px 22px rgba(207,107,214,.35);
    transition: transform .2s, background .2s, box-shadow .2s;
    opacity: 0;
  }
  .btn.show { animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .btn:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 12px 26px rgba(207,107,214,.4); }
  .btn:active { transform: translateY(0); }
  .ps {
    font-family: "Caveat", cursive; font-size: 19px;
    margin-top: 14px; opacity: 0; color: var(--ink);
  }
  .ps.show { animation: pop .5s .15s cubic-bezier(.34,1.56,.64,1) both; opacity: 0; }

  .fadeout {
    position: fixed; inset: 0; z-index: 20; background: #0b0812;
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  .fadeout.on { opacity: 1; }
</style>
</head>
<body>

<div class="chat">
  <div class="who">
    <div class="ava" id="ava"><img src="avatar.jpg" alt="" onerror="this.parentNode.innerHTML='MG'"></div>
    <div>
      <div class="name" id="name">mia 🖤</div>
      <div class="status"><i>●</i> online</div>
    </div>
  </div>

  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="bubble" id="b1">heyy, u there? 🦇</div>
  <div class="bubble" id="b2">found smth <b>sooo</b> cute but spooky&hellip;<br>soft as a lil bat 🥺🖤</div>
  <div class="photo" id="ph">
    <img src="photo.jpg" alt="" style="object-position: center 12%;" onerror="this.parentNode.style.display='none'">
    <div class="cap">look at this vibe ↑</div>
  </div>
  <div class="bubble" id="b3">u&rsquo;ll love it, i just know it <b>hehe</b> 🤞🖤</div>

  <button class="btn" id="seeBtn" type="button">okay, show me 🖤</button>
  <div class="ps" id="ps">&hellip;u won&rsquo;t regret it, promise&nbsp;♡</div>
</div>

<div class="fadeout" id="fadeout"></div>

<script>
  /* ════════════════════════════════════════════════════════════
     НАСТРОЙКИ — всё меняется только в этом блоке.

     TIER1_URL  — ссылка для тир-1 гео (США/Европа и т.п.) → Fansly
     TIER2_URL  — ссылка для всего остального (тир-2/3) → партнёрка
     Если гео-сервисы не ответили, юзера ведёт DEFAULT_URL.
     ════════════════════════════════════════════════════════════ */
  var TIER1_URL = "https://fansly.com/mia_goth/t15?r=miagoth";
  var TIER2_URL = "https://ТВОЯ_ПАРТНЁРСКАЯ_ССЫЛКА";
  var DEFAULT_URL = TIER1_URL;

  // Страны тир-1. Всё, чего нет в списке — считается тир-2/3 и идёт на TIER2_URL.
  // Добавляй/удаляй коды под условия своей партнёрки.
  var TIER1_COUNTRIES = [
    "US", "CA", "GB", "AU", "NZ", "IE",
    "DE", "AT", "CH", "NL", "BE", "LU", "FR",
    "SE", "NO", "DK", "FI", "IS", "IT", "ES", "MC", "LI"
  ];

  // ───────────────────────── дальше можно не трогать ─────────────────────────

  var STORE_URL = DEFAULT_URL;

  function pickUrl(country) {
    var c = (country || "").toUpperCase();
    if (TIER1_COUNTRIES.indexOf(c) !== -1) return TIER1_URL;
    return TIER2_URL;
  }

  // Тест из любой страны: открой страницу с ?test=DE (Германия) или ?test=IN
  var testMatch = /[?&]test=([A-Za-z]{2})/.exec(location.search);
  if (testMatch) {
    STORE_URL = pickUrl(testMatch[1]);
    console.log("[geo] test override:", testMatch[1].toUpperCase(), "→", STORE_URL);
  } else {
    fetch("https://api.country.is/")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        STORE_URL = pickUrl(d && d.country);
        console.log("[geo] country.is:", d && d.country, "→", STORE_URL);
      })
      .catch(function () {
        fetch("https://ipwho.is/")
          .then(function (r) { return r.json(); })
          .then(function (d) {
            STORE_URL = pickUrl(d && d.country_code);
            console.log("[geo] ipwho.is:", d && d.country_code, "→", STORE_URL);
          })
          .catch(function () {
            console.log("[geo] не определилось, идём на DEFAULT_URL");
          });
      });
  }

  // Защита от ботов: пропускаем только настоящие клики живого человека.
  function realHuman(e) {
    if (navigator.webdriver) return false;
    if (!e || e.isTrusted !== true) return false;
    return true;
  }

  // Сообщения появляются по очереди, как в настоящей переписке
  var steps = ["b1", "b2", "ph", "b3"];
  var typing = document.getElementById("typing");
  var i = 0;
  function next() {
    if (i >= steps.length) {
      typing.style.display = "none";
      document.getElementById("seeBtn").classList.add("show");
      document.getElementById("ps").classList.add("show");
      return;
    }
    var el = document.getElementById(steps[i]);
    typing.style.display = "none";
    el.classList.add("show");
    el.parentNode.insertBefore(typing, el.nextSibling.nextSibling || null);
    i++;
    if (i < steps.length) {
      setTimeout(function () { typing.style.display = "inline-flex"; }, 250);
    }
    setTimeout(next, 950);
  }
  setTimeout(next, 900);

  document.getElementById("seeBtn").addEventListener("click", function (e) {
    if (!realHuman(e)) return;
    document.getElementById("fadeout").classList.add("on");
    setTimeout(function () { window.location.href = STORE_URL; }, 420);
  });
</script>
</body>
</html>
